plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.eyedea3d.macrolens'
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Godot Android library: nur zum Kompilieren noetig (wird zur Laufzeit von der Engine gestellt).
    compileOnly files('../../android/build/libs/release/godot-lib.template_release.aar')

    // CameraX: native Vorschau + Frame-Stream fuer den Analyzer.
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Gebuendelter ML-Kit-Barcode-Scanner (on-device, kein Play-Services-Zwang).
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
